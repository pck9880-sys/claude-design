<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="210mm" height="297mm" viewBox="0 0 210 297"><g transform="translate(0,0)"><rect width="210" height="297" fill="white"/><text x="25" y="34.04875" font-family="Pretendard" font-weight="700" font-size="9.524999999999999" fill="#a0896c" text-anchor="start">프로그램 소개</text><text x="25" y="54.02166666666667" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">카메라로 일상을 기록하고 사진 속 이야기를 나누는 시간입니다.</text><text x="25" y="60.795" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">가까운 동네와 자연에서 나만의 장면을 찾고, 서로의 시선을</text><text x="25" y="67.56833333333333" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">이해하며 사진과 글로 한 권의 이야기를 만들어 갑니다.</text><rect x="25" y="86" width="161" height="0.15" fill="#c4b6a3" stroke="none" stroke-width="0.0"/><text x="25" y="98.02166666666666" font-family="Pretendard" font-weight="700" font-size="4.2333333333333325" fill="#a0896c" text-anchor="start">출사 및 스토리텔링</text><text x="25" y="115.02166666666666" font-family="Pretendard" font-weight="700" font-size="4.2333333333333325" fill="#a0896c" text-anchor="start">01</text><text x="40" y="114.35138888888889" font-family="Pretendard" font-weight="400" font-size="3.5277777777777777" fill="#776f64" text-anchor="start">나의 시선 소개하기</text><text x="108" y="115.02166666666666" font-family="Pretendard" font-weight="700" font-size="4.2333333333333325" fill="#a0896c" text-anchor="start">02</text><text x="123" y="114.35138888888889" font-family="Pretendard" font-weight="400" font-size="3.5277777777777777" fill="#776f64" text-anchor="start">카메라와 친해지기</text><text x="25" y="135.02166666666668" font-family="Pretendard" font-weight="700" font-size="4.2333333333333325" fill="#a0896c" text-anchor="start">03</text><text x="40" y="134.3513888888889" font-family="Pretendard" font-weight="400" font-size="3.5277777777777777" fill="#776f64" text-anchor="start">빛과 그림자 살펴보기</text><text x="108" y="135.02166666666668" font-family="Pretendard" font-weight="700" font-size="4.2333333333333325" fill="#a0896c" text-anchor="start">04</text><text x="123" y="134.3513888888889" font-family="Pretendard" font-weight="400" font-size="3.5277777777777777" fill="#776f64" text-anchor="start">우리 동네 천천히 걷기</text><text x="25" y="155.02166666666668" font-family="Pretendard" font-weight="700" font-size="4.2333333333333325" fill="#a0896c" text-anchor="start">05</text><text x="40" y="154.3513888888889" font-family="Pretendard" font-weight="400" font-size="3.5277777777777777" fill="#776f64" text-anchor="start">자연의 색 발견하기</text><text x="108" y="155.02166666666668" font-family="Pretendard" font-weight="700" font-size="4.2333333333333325" fill="#a0896c" text-anchor="start">06</text><text x="123" y="154.3513888888889" font-family="Pretendard" font-weight="400" font-size="3.5277777777777777" fill="#776f64" text-anchor="start">사진 속 이야기 나누기</text><text x="25" y="175.02166666666668" font-family="Pretendard" font-weight="700" font-size="4.2333333333333325" fill="#a0896c" text-anchor="start">07</text><text x="40" y="174.3513888888889" font-family="Pretendard" font-weight="400" font-size="3.5277777777777777" fill="#776f64" text-anchor="start">나의 작품 고르기</text><text x="108" y="175.02166666666668" font-family="Pretendard" font-weight="700" font-size="4.2333333333333325" fill="#a0896c" text-anchor="start">08</text><text x="123" y="174.3513888888889" font-family="Pretendard" font-weight="400" font-size="3.5277777777777777" fill="#776f64" text-anchor="start">사진과 글 함께 엮기</text><defs><clipPath id="crop3_20"><rect x="25" y="205" width="51" height="48"/></clipPath></defs><g clip-path="url(#crop3_20)"><image x="25.000000000000004" y="203.5" width="101.99999999999999" height="101.99999999999999" xlink:href="../../links/demo-v005/sheet-06.png"/></g><defs><clipPath id="crop3_21"><rect x="80" y