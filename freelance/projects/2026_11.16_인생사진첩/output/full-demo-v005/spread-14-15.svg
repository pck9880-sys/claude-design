<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="422mm" height="297mm" viewBox="0 0 422 297"><rect width="422" height="297" fill="#e8e8e8"/><g transform="translate(0,0)"><rect width="210" height="297" fill="white"/><text x="186" y="18.351388888888888" font-family="Pretendard" font-weight="700" font-size="3.5277777777777777" fill="#a18c97" text-anchor="end">인생사진첩</text><rect x="17" y="17" width="28" height="0.16" fill="#a18c97" stroke="none" stroke-width="0.0"/><rect x="17" y="17" width="0.16" height="21" fill="#a18c97" stroke="none" stroke-width="0.0"/><defs><clipPath id="crop14_3"><rect x="25" y="25" width="161" height="145"/></clipPath></defs><g clip-path="url(#crop14_3)"><image x="24.999999999999986" y="-144.00000000000006" width="322.00000000000006" height="322.00000000000006" xlink:href="../../links/demo-v005/sheet-03.png"/></g><rect x="194" y="156" width="0.16" height="22" fill="#a18c97" stroke="none" stroke-width="0.0"/><rect x="174" y="178" width="20" height="0.16" fill="#a18c97" stroke="none" stroke-width="0.0"/><text x="25" y="177.01625" font-family="Pretendard" font-weight="400" font-size="3.175" fill="#776f64" text-anchor="start">작품 01  /  작은 텃밭의 안부</text><rect x="25" y="190" width="32" height="73" fill="#ffffff" stroke="#a18c97" stroke-width="0.15875"/><text x="29" y="201.69736111111112" font-family="Pretendard" font-weight="700" font-size="5.997222222222222" fill="#a18c97" text-anchor="start">작은</text><text x="29" y="209.1938888888889" font-family="Pretendard" font-weight="700" font-size="5.997222222222222" fill="#a18c97" text-anchor="start">생명의</text><text x="29" y="216.69041666666666" font-family="Pretendard" font-weight="700" font-size="5.997222222222222" fill="#a18c97" text-anchor="start">안부를</text><text x="29" y="224.18694444444446" font-family="Pretendard" font-weight="700" font-size="5.997222222222222" fill="#a18c97" text-anchor="start">묻다</text><text x="65" y="194.69194444444443" font-family="Pretendard" font-weight="700" font-size="4.938888888888888" fill="#a18c97" text-anchor="start">강명자 작가</text><text x="65" y="207.02166666666668" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#413c35" text-anchor="start">식물과 꽃을 돌보며 하루를 보냅니다.</text><text x="65" y="213.58333333333334" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#413c35" text-anchor="start">작은 생명이 자라는 순간을</text><text x="65" y="220.145" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#413c35" text-anchor="start">사진으로 함께 나누고 싶습니다.</text><rect x="65" y="226" width="121" height="0.14" fill="#c4b6a3" stroke="none" stroke-width="0.0"/><text x="65" y="232.51895833333333" font-family="Pretendard" font-weight="700" font-size="3.7041666666666666" fill="#a18c97" text-anchor="start">사진에 담은 순간</text><text x="65" y="243.8540972222222" font-family="Pretendard" font-weight="400" font-size="4.056944444444444" fill="#776f64" text-anchor="start">비가 지난 텃밭에 싱싱한 초록이</text><text x="65" y="250.34520833333332" font-family="Pretendard" font-weight="400" font-size="4.056944444444444" fill="#776f64" text-anchor="start">가득합니다. 그 순간의 마음을</text><text x="65" y="256.8363194444444" font-family="Pretendard" font-weight="400" font-size="4.056944444444444" fill="#776f64" text-anchor="start">담았습니다.</text><text x="132" y="232.51895833333333" font-family="Pretendard" font-weight="700" font-size="3.7041666666666666" fill="#a18c97" text-anchor="start">작가의 한마디</text><text x="132" y="244.35680555555555" font-family="Pretendard" font-weight="700" font-size="4.586111111111111" fill="#413c35" text-anchor="start">“작은 꽃 한 송이가</text><text x="132" y="251.23597222222222" font-family="Pretendard" font-weight="700" font-size="4.586111111111111" fill="#413c35" text-anchor="start">하루를 환하게</text><text x="132" y="258.1151388888889" font-family="Pretendard" font-weight="700" font-size="4.586111111111111" fill="#413c35" text-anchor="start">만들어 줍니다.”</text><rect x="25" y="275" width="161" height="0.12" fill="#c4b6a3" stroke="none" stroke-width="0.0"/><text x="45" y="281.18381944444445" font-family="Pretendard" font-weight="400" font-size="3.3513888888888888" fill="#776f64" text-anchor="start">인생사진첩</text><text x="186" y="281.18381944444445" font-family="Pretendard" font-weight="400" font-size="3.3513888888888888" fill="#776f64" text-anchor="end">프레임에 담긴 나의 세상</text><text x="25" y="281.01895833333333" font-family="Pretendard" font-weight="700" font-size="3.7041666666666666" fill="#a18c97" text-anchor="start">14</text></g><g transform="translate(212,0)"><rect width="210" height="297" fill="white"/><text x="25" y="31.0325" font-family="Pretendard" font-weight="700" font-size="6.35" fill="#a18c97" text-anchor="start">담장 곁의 노란 인사</text><text x="25" y="43.02166666666667" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">나무 울타리 곁에 노란 꽃이 피었습니다. 작고 환한 빛이 평범한 산책길을 특별하게 바꾸어</text><text x="25" y="49.795" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">놓았습니다.</text><defs><clipPath id="crop15_2"><rect x="25" y="65" width="161" height="199"/></clipPath></defs><g clip-path="url(#crop15_2)"><image x="-192.99999999999994" y="-133.99999999999994" width="397.99999999999994" height="397.99999999999994" xlink:href="../../links/demo-v005/sheet-03.png"/></g><text x="186" y="281.01895833333333" font-family="Pretendard" font-weight="700" font-size="3.7041666666666666" fill="#a18c97" text-anchor="end">15</text></g></svg>