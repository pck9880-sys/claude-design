<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="210mm" height="297mm" viewBox="0 0 210 297"><g transform="translate(0,0)"><rect width="210" height="297" fill="white"/><text x="25" y="34.04875" font-family="Pretendard" font-weight="700" font-size="9.524999999999999" fill="#a0896c" text-anchor="start">인사말</text><rect x="25" y="49" width="161" height="0.15" fill="#c4b6a3" stroke="none" stroke-width="0.0"/><text x="25" y="71.02166666666666" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">사진을 찍는 일은 익숙한 일상을 새로운 눈으로 바라보는 일입니다.</text><text x="25" y="77.79499999999999" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">무심히 지나쳤던 골목과 창가, 작은 꽃과 나무가 카메라를 통해</text><text x="25" y="84.56833333333333" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">저마다의 이야기를 들려주었습니다.</text><text x="25" y="91.34166666666665" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start"></text><text x="25" y="98.115" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">이 작품집에는 가까운 곳에서 아름다움을 발견하고, 자신의 시선으로</text><text x="25" y="104.88833333333332" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">한 장면을 골라 기록해 보는 과정의 의미를 담고자 했습니다.</text><text x="25" y="111.66166666666666" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">사진의 기술보다 소중한 것은 직접 바라보고 느낀 마음입니다.</text><text x="25" y="118.43499999999999" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start"></text><text x="25" y="125.20833333333331" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">서로의 사진을 보고 이야기를 나누는 동안, 평범했던 하루는</text><text x="25" y="131.98166666666665" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">함께 기억하고 싶은 시간이 되었습니다. 한 장의 사진에 담긴</text><text x="25" y="138.755" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">생각과 감정이 보는 분들의 일상에도 작은 쉼이 되기를 바랍니다.</text><text x="25" y="145.5283333333333" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start"></text><text x="25" y="152.30166666666665" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">새로운 도전에 마음을 열고 자신의 이야기를 사진으로 표현하는</text><text x="25" y="159.075" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">모든 분께 따뜻한 응원을 전합니다. 앞으로도 일상 속 작은 발견과</text><text x="25" y="165.8483333333333" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">즐거운 배움의 시간이 오래 이어지기를 바랍니다.</text><text x="25" y="172.62166666666664" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start"></text><text x="25" y="179.39499999999998" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">한 페이지씩 천천히 넘기며 각자의 시선이 머문 자리를 함께</text><text x="25" y="186.1683333333333" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#776f64" text-anchor="start">걸어 주시기 바랍니다. 감사합니다.</text><text x="186" y="244.3513888888889" font-family="Pretendard" font-weight="400" font-size="3.5277777777777777" fill="#413c35" text-anchor="end">동래구노인복지관</text><text x="186" y="249.64305555555555" font-family="Pretendard" font-weight="400" font-size="3.5277777777777777" fill="#413c35" text-anchor="end">재가노인지원서비스센터 센터장</text><rect x="25" y="275" width="161" height="0.12" fill="#c4b6a3" stroke="none" stroke-width="0.0"/><text x="45" y="281.18381944444445" font-family="Pretendard" font-weight="400" font-size="3.3513888888888888" fill="#776f64" text-anchor="start">인생사진첩</text><text x="186" y="281.18381944444445" font-family="Pretendard" font-weight="400" font-size="3.3513888888888888" fill="#776f64" text-anchor="end">프레임에 담긴 나의 세상</text><text x="25" y="281.01895833333333" font-family="Pretendard" font-weight="700" font-size="3.7041666666666666" fill="#a0896c" text-anchor="start">02</text></g></svg>