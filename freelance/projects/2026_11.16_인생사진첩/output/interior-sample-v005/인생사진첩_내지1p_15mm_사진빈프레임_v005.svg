<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="white"/><text x="190" y="18.351388888888888" font-family="Pretendard" font-weight="700" font-size="3.5277777777777777" fill="#a0896c" text-anchor="end">인생사진첩</text><rect x="17" y="17" width="28" height="0.16" fill="#a0896c" stroke="none" stroke-width="0.0"/><rect x="17" y="17" width="0.16" height="21" fill="#a0896c" stroke="none" stroke-width="0.0"/><rect x="24" y="21" width="10" height="0.12" fill="#c4b6a3" stroke="none" stroke-width="0.0"/><rect x="24" y="21" width="0.12" height="8" fill="#c4b6a3" stroke="none" stroke-width="0.0"/><rect x="25" y="25" width="165" height="153" fill="#f4f0e9" stroke="#c4b6a3" stroke-width="0.12"/><rect x="194" y="163" width="0.16" height="22" fill="#a0896c" stroke="none" stroke-width="0.0"/><rect x="174" y="185" width="20" height="0.16" fill="#a0896c" stroke="none" stroke-width="0.0"/><text x="25" y="185.01625" font-family="Pretendard" font-weight="400" font-size="3.175" fill="#776f64" text-anchor="start">작품 01  /  빛이 머문 오래된 골목</text><rect x="25" y="198" width="32" height="73" fill="#ffffff" stroke="#a0896c" stroke-width="0.15875"/><text x="29" y="209.69736111111112" font-family="Pretendard" font-weight="700" font-size="5.997222222222222" fill="#a0896c" text-anchor="start">평범한</text><text x="29" y="217.1938888888889" font-family="Pretendard" font-weight="700" font-size="5.997222222222222" fill="#a0896c" text-anchor="start">하루를</text><text x="29" y="224.69041666666666" font-family="Pretendard" font-weight="700" font-size="5.997222222222222" fill="#a0896c" text-anchor="start">새롭게</text><text x="29" y="232.18694444444446" font-family="Pretendard" font-weight="700" font-size="5.997222222222222" fill="#a0896c" text-anchor="start">바라보다</text><text x="60" y="202.69194444444443" font-family="Pretendard" font-weight="700" font-size="4.938888888888888" fill="#a0896c" text-anchor="start">김정숙 작가</text><text x="60" y="215.02166666666668" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#413c35" text-anchor="start">익숙한 동네를 천천히 걷습니다.</text><text x="60" y="221.58333333333334" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#413c35" text-anchor="start">무심코 지나쳤던 풍경에서 오래된 기억과</text><text x="60" y="228.145" font-family="Pretendard" font-weight="400" font-size="4.2333333333333325" fill="#413c35" text-anchor="start">새로운 이야기를 발견하는 시간이 좋습니다.</text><rect x="60" y="234" width="130" height="0.14" fill="#c4b6a3" stroke="none" stroke-width="0.0"/><text x="60" y="240.51895833333333" font-family="Pretendard" font-weight="700" font-size="3.7041666666666666" fill="#a0896c" text-anchor="start">사진에 담은 순간</text><text x="60" y="251.8540972222222" font-family="Pretendard" font-weight="400" font-size="4.056944444444444" fill="#776f64" text-anchor="start">낮은 담장 위로 햇살이</text><text x="60" y="258.3452083333333" font-family="Pretendard" font-weight="400" font-size="4.056944444444444" fill="#776f64" text-anchor="start">내려앉았습니다. 오래된 대문과</text><text x="60" y="264.8363194444444" font-family="Pretendard" font-weight="400" font-size="4.056944444444444" fill="#776f64" text-anchor="start">화분 사이에서 잠시 발걸음을</text><text x="60" y="271.32743055555557" font-family="Pretendard" font-weight="400" font-size="4.056944444444444" fill="#776f64" text-anchor="start">멈추었습니다.</text><text x="132" y="240.51895833333333" font-family="Pretendard" font-weight="700" font-size="3.7041666666666666" fill="#a0896c" text-anchor="start">작가의 한마디</text><text x="132" y="252.35680555555555" font-family="Pretendard" font-weight="700" font-size="4.586111111111111" fill="#413c35" text-anchor="start">“매일 걷던 길도,</text><text x="132" y="259.23597222222224" font-family="Pretendard" font-weight="700" font-size="4.586111111111111" fill="#413c35" text-anchor="start">카메라로 바라보니</text><text x="132" y="266.1151388888889" font-family="Pretendard" font-weight="700" font-size="4.586111111111111" fill="#413c35" text-anchor="start">새로웠습니다.”</text><rect x="25" y="275" width="165" height="0.12" fill="#c4b6a3" stroke="none" stroke-width="0.0"/><text x="45" y="281.18381944444445" font-family="Pretendard" font-weight="400" font-size="3.3513888888888888" fill="#776f64" text-anchor="start">인생사진첩</text><text x="190" y="281.18381944444445" font-family="Pretendard" font-weight="400" font-size="3.3513888888888888" fill="#776f64" text-anchor="end">프레임에 담긴 나의 세상</text><text x="25" y="281.01895833333333" font-family="Pretendard" font-weight="700" font-size="3.7041666666666666" fill="#a0896c" text-anchor="start">04</text></svg>